plugins {
    id 'com.android.application'
}

// Release signing (Google Play upload key). The key and its passwords never live in the repository:
// keystore.properties is read from -Pkepler.signing=<path>, or from ~/.kepler-signing/keystore.properties.
// Every build gets a higher versionCode: the number of commits on the current branch (fallback 1 outside git).
def gitVersionCode = { ->
    try {
        def p = ['git', 'rev-list', '--count', 'HEAD'].execute(null, rootDir)
        p.waitFor()
        def n = p.text.trim()
        return n.isInteger() ? n.toInteger() : 1
    } catch (ignored) { return 1 }
}

def signingFile = file(project.findProperty('kepler.signing') ?: "${System.getProperty('user.home')}/.kepler-signing/keystore.properties")
def signingProps = new Properties()
if (signingFile.isFile()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'com.keplerslicer.app'
    compileSdk 36

    defaultConfig {
        // Fixed for Google Play: never change applicationId after the first release.
        applicationId 'com.keplerslicer.app'
        minSdk 33
        targetSdk 36
        versionCode gitVersionCode()
        versionName '1.0.3'
        // Match the built native engine. This also tells Android Studio which
        // ABI to deploy when a device supports native translation.
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            if (signingProps.getProperty('storeFile')) {
                storeFile file(signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // Code shrinking stays off: the JNI bridge and JSON-driven settings rely on exact class/member names.
            minifyEnabled false
            shrinkResources false
            if (signingProps.getProperty('storeFile')) signingConfig signingConfigs.release
        }
    }

    bundle {
        // One ABI only; the language split would drop the in-app language switch (Russian/English).
        language { enableSplit = false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    implementation project(':engine')
}
