plugins {
    id 'com.android.application'
}

android {
    namespace 'com.keplerslicer.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.orcamobile.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
        // Match the built native engine. This also tells Android Studio which
        // ABI to deploy when a device supports native translation.
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
